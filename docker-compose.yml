services:

  icub-controller-dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JOBS: "4"
    image: icub-controller:latest

    network_mode: host

    runtime: nvidia

    environment:
      DISPLAY: "${DISPLAY}"
      XAUTHORITY: "${XAUTHORITY}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,utility

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - .:/workspace/icub_whole_body_task_controller

    stdin_open: true
    tty: true
